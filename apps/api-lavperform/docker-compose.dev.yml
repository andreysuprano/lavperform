services:
  postgres:
    image: postgres:15-alpine
    container_name: lavperform_db_dev
    environment:
      POSTGRES_USER: lavperform
      POSTGRES_PASSWORD: lavperform
      POSTGRES_DB: lavperform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - lavperform_network_dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lavperform" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lavperform_redis_dev
    ports:
      - "6379:6379"
    networks:
      - lavperform_network_dev
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:

networks:
  lavperform_network_dev:
    driver: bridge
